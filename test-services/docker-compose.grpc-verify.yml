services:
  db-svc:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      - PORT=8083
    networks:
      - grpc-net

  inventory-svc:
    build:
      context: .
      dockerfile: Dockerfile.inventory
    environment:
      - PORT=8082
      - DB_SVC_ADDR=db-svc:8083
    depends_on:
      - db-svc
    networks:
      - grpc-net

  # proxy-agent sits between order-svc and inventory-svc
  # Listens on :8082 (same as inventory-svc port)
  # HTTP target: order-svc (unused but required)
  # gRPC target: inventory-svc:8082
  proxy-agent:
    build:
      context: ../proxy-agent
      dockerfile: Dockerfile
    environment:
      - PROXY_TARGET=http://order-svc:8081
      - GRPC_TARGET=inventory-svc:8082
      - PROXY_PORT=8082
      - CONTROL_PORT=9090
      - INITIAL_MODE=passthrough
    ports:
      - "19090:9090"
    networks:
      - grpc-net

  order-svc:
    build:
      context: .
      dockerfile: Dockerfile.order
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - INVENTORY_SVC_ADDR=proxy-agent:8082
    depends_on:
      - proxy-agent
      - inventory-svc
    networks:
      - grpc-net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ORDER_SVC_ADDR=order-svc:8081
    depends_on:
      - order-svc
    networks:
      - grpc-net

networks:
  grpc-net:
    driver: bridge

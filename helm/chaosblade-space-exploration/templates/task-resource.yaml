apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-task-resource
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-resource" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.taskResource.replicas }}
  selector:
    matchLabels:
      {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-resource" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-resource" "context" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "space-exploration.serviceAccountName" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: svc-task-resource
          image: {{ include "space-exploration.image" (dict "image" .Values.taskResource.image "context" .) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.taskResource.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "space-exploration.fullname" . }}-config
            - secretRef:
                name: {{ include "space-exploration.fullname" . }}-db-secret
          env:
            - name: SERVER_PORT
              value: {{ .Values.taskResource.port | quote }}
            - name: EXTERNAL_TOPOLOGY_BASE_URL
              value: {{ printf "http://svc-k8s-graph.%s.svc.cluster.local:%d" .Values.namespace (int .Values.k8sGraph.port) | quote }}
            - name: EXECUTOR_BASE_URL
              value: {{ printf "http://svc-task-executor.%s.svc.cluster.local:%d" .Values.namespace (int .Values.taskExecutor.port) | quote }}
            - name: LLM_API_URL
              value: {{ .Values.llm.apiUrl | quote }}
            - name: LLM_API_KEY
              value: {{ .Values.llm.apiKey | quote }}
            - name: LLM_API_MODEL
              value: {{ .Values.llm.model | quote }}
          resources:
            {{- toYaml .Values.taskResource.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 15
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}

---
apiVersion: v1
kind: Service
metadata:
  name: svc-task-resource
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-resource" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.taskResource.port }}
      targetPort: {{ .Values.taskResource.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-resource" "context" .) | nindent 4 }}

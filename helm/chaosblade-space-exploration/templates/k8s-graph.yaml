apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-k8s-graph
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-k8s-graph" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.k8sGraph.replicas }}
  selector:
    matchLabels:
      {{- include "space-exploration.selectorLabels" (dict "component" "svc-k8s-graph" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "space-exploration.selectorLabels" (dict "component" "svc-k8s-graph" "context" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "space-exploration.serviceAccountName" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: svc-k8s-graph
          image: {{ include "space-exploration.image" (dict "image" .Values.k8sGraph.image "context" .) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.k8sGraph.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "space-exploration.fullname" . }}-config
            - secretRef:
                name: {{ include "space-exploration.fullname" . }}-db-secret
          env:
            - name: SERVER_PORT
              value: {{ .Values.k8sGraph.port | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:mysql://%s:3306/spaceexploration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8" (include "space-exploration.mysqlHost" .) | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATA_REDIS_HOST
              value: {{ include "space-exploration.redisHost" . | quote }}
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: K8S_API_URL
              value: {{ .Values.kubernetes.apiUrl | quote }}
            - name: K8S_IN_CLUSTER
              value: {{ .Values.kubernetes.inCluster | quote }}
          # svc-k8s-graph 启动需要 ~70s，probe 需要更长的初始延迟
          livenessProbe:
            httpGet:
              path: /api/k8s-graph/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/k8s-graph/health
              port: http
            initialDelaySeconds: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: svc-k8s-graph
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-k8s-graph" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.k8sGraph.port }}
      targetPort: {{ .Values.k8sGraph.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-k8s-graph" "context" .) | nindent 4 }}

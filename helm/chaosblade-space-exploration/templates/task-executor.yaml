apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-task-executor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-executor" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.taskExecutor.replicas }}
  selector:
    matchLabels:
      {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-executor" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-executor" "context" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "space-exploration.serviceAccountName" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: svc-task-executor
          image: {{ include "space-exploration.image" (dict "image" .Values.taskExecutor.image "context" .) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.taskExecutor.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "space-exploration.fullname" . }}-config
            - secretRef:
                name: {{ include "space-exploration.fullname" . }}-db-secret
          env:
            - name: SERVER_PORT
              value: {{ .Values.taskExecutor.port | quote }}
            - name: PROXY_BASE_URL
              value: {{ printf "http://svc-reqrsp-proxy.%s.svc.cluster.local:%d" .Values.namespace (int .Values.reqrspProxy.port) | quote }}
            - name: SCHEDULER_BASE_URL
              value: {{ printf "http://svc-fault-scheduler.%s.svc.cluster.local:8103" .Values.namespace | quote }}
            - name: LLM_API_URL
              value: {{ .Values.llm.apiUrl | quote }}
            - name: LLM_API_KEY
              value: {{ .Values.llm.apiKey | quote }}
            - name: LLM_API_MODEL
              value: {{ .Values.llm.model | quote }}
          resources:
            {{- toYaml .Values.taskExecutor.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 15
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}

---
apiVersion: v1
kind: Service
metadata:
  name: svc-task-executor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-executor" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.taskExecutor.port }}
      targetPort: {{ .Values.taskExecutor.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-task-executor" "context" .) | nindent 4 }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "space-exploration.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "space-exploration.fullname" . }}-proxy-manager
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
rules:
  # Manage proxy-agent Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Manage Services and Endpoints (for traffic hijack)
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read/manage Pods (for status checks and log tailing)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  # ConfigMaps (proxy configuration)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespaces (discovery)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "space-exploration.fullname" . }}-proxy-manager-binding
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "space-exploration.fullname" . }}-proxy-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "space-exploration.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}

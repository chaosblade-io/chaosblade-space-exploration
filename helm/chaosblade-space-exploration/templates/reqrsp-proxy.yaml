apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-reqrsp-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-reqrsp-proxy" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.reqrspProxy.replicas }}
  selector:
    matchLabels:
      {{- include "space-exploration.selectorLabels" (dict "component" "svc-reqrsp-proxy" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "space-exploration.selectorLabels" (dict "component" "svc-reqrsp-proxy" "context" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "space-exploration.serviceAccountName" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: svc-reqrsp-proxy
          image: {{ include "space-exploration.image" (dict "image" .Values.reqrspProxy.image "context" .) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.reqrspProxy.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "space-exploration.fullname" . }}-config
            - secretRef:
                name: {{ include "space-exploration.fullname" . }}-db-secret
          env:
            - name: SERVER_PORT
              value: {{ .Values.reqrspProxy.port | quote }}
            - name: PROXY_ENGINE
              value: {{ .Values.reqrspProxy.proxyEngine | quote }}
          resources:
            {{- toYaml .Values.reqrspProxy.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 15
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}

---
apiVersion: v1
kind: Service
metadata:
  name: svc-reqrsp-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "space-exploration.labels" . | nindent 4 }}
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-reqrsp-proxy" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.reqrspProxy.port }}
      targetPort: {{ .Values.reqrspProxy.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "space-exploration.selectorLabels" (dict "component" "svc-reqrsp-proxy" "context" .) | nindent 4 }}
